<meta charset="UTF-8">

<style>
:root {
  --bg:#f5f6f8;--surface:#fff;--sidebar:#1a2332;--sidebar-hover:#243044;--sidebar-active:#2c3e56;
  --text:#1e2a3a;--text2:#64748b;--border:#e2e6ec;--accent:#2563eb;--accent-light:#dbeafe;
  --green:#059669;--green-l:#d1fae5;--orange:#d97706;--orange-l:#fef3c7;--red:#dc2626;--red-l:#fee2e2;
  --purple:#7c3aed;--purple-l:#ede9fe;--radius:10px;--shadow:0 1px 3px rgba(0,0,0,.06);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1419;--surface:#1a2332;--sidebar:#0d1117;--sidebar-hover:#161b22;--sidebar-active:#1f2937;
    --text:#e2e8f0;--text2:#94a3b8;--border:#2d3748;--accent:#3b82f6;--accent-light:#1e3a5f;
    --green-l:#064e3b;--orange-l:#78350f;--red-l:#7f1d1d;--purple-l:#3b1f6e;--shadow:0 1px 3px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1419;--surface:#1a2332;--sidebar:#0d1117;--sidebar-hover:#161b22;--sidebar-active:#1f2937;
  --text:#e2e8f0;--text2:#94a3b8;--border:#2d3748;--accent:#3b82f6;--accent-light:#1e3a5f;
  --green-l:#064e3b;--orange-l:#78350f;--red-l:#7f1d1d;--purple-l:#3b1f6e;--shadow:0 1px 3px rgba(0,0,0,.3);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;overflow:hidden}

.sidebar{width:220px;background:var(--sidebar);color:#cbd5e1;display:flex;flex-direction:column;flex-shrink:0;padding:20px 0;height:100vh;position:sticky;top:0}
.sidebar .logo{padding:0 20px 24px;font-size:18px;font-weight:700;color:#fff;letter-spacing:-.3px}
.sidebar .logo span{color:var(--accent)}
.sidebar nav{flex:1}
.sidebar nav a{display:flex;align-items:center;gap:10px;padding:10px 20px;color:#94a3b8;text-decoration:none;font-size:14px;font-weight:500;transition:all .15s;cursor:pointer;border-left:3px solid transparent}
.sidebar nav a:hover{background:var(--sidebar-hover);color:#e2e8f0}
.sidebar nav a.active{background:var(--sidebar-active);color:#fff;border-left-color:var(--accent)}
.sidebar nav a svg{width:18px;height:18px;flex-shrink:0}
.sidebar .ub{padding:16px 20px;border-top:1px solid #2d3748;font-size:13px}
.sidebar .ub .n{color:#fff;font-weight:600}
.sidebar .ub .r{color:#64748b;font-size:12px}

.main{flex:1;overflow-y:auto;padding:28px 32px;min-width:0}
.pt{font-size:22px;font-weight:700;margin-bottom:4px;letter-spacing:-.3px}
.ps{font-size:13px;color:var(--text2);margin-bottom:24px}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.top-bar .left .pt{margin-bottom:2px}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.sc .l{font-size:12px;color:var(--text2);font-weight:500;margin-bottom:4px}
.sc .v{font-size:22px;font-weight:700;letter-spacing:-.5px}
.sc .s{font-size:11px;color:var(--text2);margin-top:3px}

.tw{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto;margin-bottom:20px}
.th{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.th h3{font-size:14px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:9px 14px;font-weight:600;color:var(--text2);font-size:11.5px;border-bottom:1px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
tbody td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg)}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-gr{background:var(--green-l);color:var(--green)}.b-or{background:var(--orange-l);color:var(--orange)}
.b-re{background:var(--red-l);color:var(--red)}.b-bl{background:var(--accent-light);color:var(--accent)}
.b-pu{background:var(--purple-l);color:var(--purple)}.b-gy{background:var(--bg);color:var(--text2)}

.dp{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px}
.dh{padding:18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start}
.dh h3{font-size:16px;font-weight:700}
.dh .m{font-size:12px;color:var(--text2);margin-top:2px}
.db{padding:18px}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.fg .f .fl{font-size:11px;color:var(--text2);font-weight:500;margin-bottom:2px}
.fg .f .fv{font-size:14px;font-weight:500}

.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--accent);cursor:pointer;margin-bottom:14px;font-weight:500;background:none;border:none;font-family:inherit}
.cl{cursor:pointer;color:var(--accent);font-weight:500}
.am{font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}
.st{font-size:13px;font-weight:600;margin-bottom:10px}

.btn{padding:7px 14px;border-radius:6px;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.btn-p{background:var(--accent);color:#fff}
.btn-p:hover{background:#1d4ed8}
.btn-o{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-o:hover{background:var(--bg)}
.btn-d{background:var(--red-l);color:var(--red)}
.btn-d:hover{background:#fecaca}
.btn-s{padding:5px 10px;font-size:12px}
.btn-g{background:var(--green-l);color:var(--green)}
.btn-g:hover{background:#a7f3d0}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:600px;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:slideUp .2s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:16px;font-weight:700}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2);padding:4px 8px;border-radius:4px}
.modal-close:hover{background:var(--bg)}
.modal-body{padding:22px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

.form-row{margin-bottom:16px}
.form-row label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:7px;font-size:13px;background:var(--bg);color:var(--text);font-family:inherit}
.form-row textarea{resize:vertical;min-height:60px}
.form-row select{appearance:auto}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.form-grid .form-row{margin-bottom:14px}
.form-full{grid-column:1/-1}

.confirm-text{font-size:14px;line-height:1.6;margin-bottom:8px}
.confirm-text strong{color:var(--red)}

.empty-state{padding:32px;text-align:center;color:var(--text2);font-size:13px}

.svc-card{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;background:var(--bg)}
.svc-card .svc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.svc-card .svc-top strong{font-size:13px}

@media(max-width:900px){.sidebar{display:none}.main{padding:16px}.stat-row{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}
</style>
</head>

function openModal(title,bodyHtml,footHtml,wide){

    <div class="modal-foot">${footHtml}</div>

  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov)closeModal()});
}

    <div class="dp"><div class="dh"><div><h3>${t.id} — ${t.dest}</h3><div class="m"><span class="cl" onclick="showCustomer('${t.customerId}')">${c.name}</span> · ${t.pax} pax · ${t.startDate} → ${t.endDate}</div></div><div style="display:flex;gap:8px">${badge(t.status)}<button class="btn btn-o btn-s" onclick="openTripForm('${t.id}')">Edit Trip</button></div></div><div class="db">
    <div class="stat-row" style="margin-bottom:18px">
      <div class="sc"><div class="l">Cost</div><div class="v am">${fmt(co)}</div></div>
      <div class="sc"><div class="l">Sell</div><div class="v am">${fmt(se)}</div></div>
      <div class="sc"><div class="l">Margin</div><div class="v am" style="color:var(--green)">${fmt(se-co)}</div><div class="s">${se?(((se-co)/se)*100).toFixed(1):0}%</div></div>
      <div class="sc"><div class="l">Cust Paid</div><div class="v am">${fmt(pd)}</div><div class="s">Bal ${fmt(se-pd)}</div></div>
      <div class="sc"><div class="l">Partner Paid</div><div class="v am">${fmt(ppd)}</div><div class="s">Due ${fmt(co-ppd)}</div></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div class="st" style="margin:0">Services</div><button class="btn btn-p btn-s" onclick="openSvcForm('${t.id}')">+ Add Service</button></div>
    <div class="tw"><table><thead><tr><th>Partner</th><th>Type</th><th>Desc</th><th>Dates</th><th>Cost</th><th>Sell</th><th>Ref</th><th>Status</th><th></th></tr></thead><tbody>
    ${t.services.map(sv=>{const p=gp(sv.partnerId);return `<tr><td><span class="cl" onclick="showPartner('${sv.partnerId}')">${p?p.name:'—'}</span></td><td>${sv.type}</td><td>${sv.desc}</td><td style="font-size:12px">${sv.dates}</td><td class="am">${fmt(sv.cost)}</td><td class="am">${fmt(sv.sell)}</td><td style="font-size:12px">${sv.confRef||'—'}</td><td>${badge(sv.status)}</td><td><button class="btn btn-o btn-s" onclick="openSvcForm('${t.id}','${sv.id}')">Edit</button></td></tr>`}).join('')||`<tr><td colspan="9" class="empty-state">No services added yet</td></tr>`}
    </tbody></table></div>
    <div class="two">
      <div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div class="st" style="margin:0">Customer Payments</div><button class="btn btn-g btn-s" onclick="openCustPayForm('${t.id}')">+ Record</button></div>
      <div class="tw"><table><thead><tr><th>Date</th><th>Amount</th><th>Mode</th><th>Ref</th><th>Note</th></tr></thead><tbody>
      ${custPayments.filter(p=>p.tripId===t.id).map(p=>`<tr><td style="font-size:12px">${p.date}</td><td class="am" style="color:var(--green)">${fmt(p.amount)}</td><td>${p.mode}</td><td style="font-size:12px">${p.ref}</td><td style="font-size:12px">${p.note}</td></tr>`).join('')||'<tr><td colspan="5" class="empty-state">No payments</td></tr>'}
      </tbody></table></div></div>
      <div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div class="st" style="margin:0">Partner Payments</div><button class="btn btn-g btn-s" onclick="openPartPayForm('${t.id}')">+ Record</button></div>
      <div class="tw"><table><thead><tr><th>Partner</th><th>Date</th><th>Amount</th><th>Mode</th><th>Ref</th></tr></thead><tbody>
      ${partPayments.filter(p=>p.tripId===t.id).map(p=>`<tr><td style="font-size:13px">${gp(p.partnerId)?.name||'—'}</td><td style="font-size:12px">${p.date}</td><td class="am" style="color:var(--red)">${fmt(p.amount)}</td><td>${p.mode}</td><td style="font-size:12px">${p.ref}</td></tr>`).join('')||'<tr><td colspan="5" class="empty-state">No payments</td></tr>'}
      </tbody></table></div></div>
    </div></div></div>`;
  };render();
};

// ─── SERVICE FORM ──────────────────────
window.openSvcForm = function(tripId,svcId){
  const t=trips.find(x=>x.id===tripId);
  const sv=svcId?t.services.find(s=>s.id===svcId):null;
  openModal(sv?'Edit Service':'Add Service',`<div class="form-grid">
    <div class="form-row"><label>Partner</label><select id="f-svpart">${partners.filter(p=>p.status==='Active').map(p=>`<option value="${p.id}" ${sv&&sv.partnerId===p.id?'selected':''}>${p.name} (${p.type})</option>`).join('')}</select></div>
    <div class="form-row"><label>Service Type</label><select id="f-svtype">${svcTypes.map(s=>`<option ${sv&&sv.type===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="form-row form-full"><label>Description</label><input id="f-svdesc" value="${sv?sv.desc:''}"></div>
    <div class="form-row"><label>Dates</label><input id="f-svdates" value="${sv?sv.dates:''}" placeholder="e.g. Oct 15–18"></div>
    <div class="form-row"><label>Partner Cost (₹)</label><input type="number" id="f-svcost" value="${sv?sv.cost:''}" min="0"></div>
    <div class="form-row"><label>Sell Price (₹)</label><input type="number" id="f-svsell" value="${sv?sv.sell:''}" min="0"></div>
    <div class="form-row"><label>Confirmation Ref</label><input id="f-svref" value="${sv?sv.confRef:''}"></div>
    <div class="form-row"><label>Status</label><select id="f-svstat">${svcStatuses.map(s=>`<option ${sv&&sv.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
  </div>`,
  `<button class="btn btn-o" onclick="closeModal()">Cancel</button>${sv?`<button class="btn btn-d" onclick="delSvc('${tripId}','${svcId}')">Delete</button>`:''}<button class="btn btn-p" onclick="saveSvc('${tripId}','${svcId||''}')">${sv?'Update':'Add'}</button>`);
};
window.saveSvc = function(tripId,svcId){
  const d={partnerId:mVal('f-svpart'),type:mVal('f-svtype'),desc:mVal('f-svdesc'),dates:mVal('f-svdates'),cost:mNum('f-svcost'),sell:mNum('f-svsell'),confRef:mVal('f-svref'),status:mVal('f-svstat')};
  if(!d.desc)return alert('Description required');
  const t=trips.find(x=>x.id===tripId);
  if(svcId){Object.assign(t.services.find(s=>s.id===svcId),d)}else{t.services.push({id:nid('TS'),...d})}
  closeModal();showTrip(tripId);
};
window.delSvc = function(tripId,svcId){
  if(partPayments.some(p=>p.svcIds.includes(svcId)))return alert('Cannot delete: has payments');
  const t=trips.find(x=>x.id===tripId);
  t.services=t.services.filter(s=>s.id!==svcId);closeModal();showTrip(tripId);
};

// ═══════════════════════════════════════
// PAYMENTS CRUD
// ═══════════════════════════════════════
function rPay(){
  const ri=custPayments.reduce((s,p)=>s+p.amount,0),po=partPayments.reduce((s,p)=>s+p.amount,0);
  return `<div class="top-bar"><div class="left"><div class="pt">Payments</div><div class="ps" style="margin:0">Money in and out</div></div><div style="display:flex;gap:8px"><button class="btn btn-g" onclick="openCustPayForm()">+ Customer Payment</button><button class="btn btn-p" onclick="openPartPayForm()">+ Partner Payment</button></div></div>
  <div class="stat-row">
    <div class="sc"><div class="l">Total Received</div><div class="v am" style="color:var(--green)">${fmt(ri)}</div></div>
    <div class="sc"><div class="l">Total Paid Out</div><div class="v am" style="color:var(--red)">${fmt(po)}</div></div>
    <div class="sc"><div class="l">Net Position</div><div class="v am">${fmt(ri-po)}</div></div>
  </div>
  <div class="two">
    <div class="tw"><div class="th"><h3>Customer Payments (In)</h3></div><table><thead><tr><th>Date</th><th>Trip</th><th>Customer</th><th>Amount</th><th>Mode</th><th>Ref</th></tr></thead><tbody>
    ${[...custPayments].reverse().map(p=>{const t=trips.find(x=>x.id===p.tripId);return `<tr><td style="font-size:12px">${p.date}</td><td><span class="cl" onclick="showTrip('${p.tripId}')">${p.tripId}</span></td><td>${t?gc(t.customerId).name:'—'}</td><td class="am" style="color:var(--green)">${fmt(p.amount)}</td><td>${p.mode}</td><td style="font-size:12px">${p.ref}</td></tr>`}).join('')}
    </tbody></table></div>
    <div class="tw"><div class="th"><h3>Partner Payments (Out)</h3></div><table><thead><tr><th>Date</th><th>Trip</th><th>Partner</th><th>Amount</th><th>Mode</th><th>Ref</th></tr></thead><tbody>
    ${[...partPayments].reverse().map(p=>`<tr><td style="font-size:12px">${p.date}</td><td><span class="cl" onclick="showTrip('${p.tripId}')">${p.tripId}</span></td><td>${gp(p.partnerId)?.name||'—'}</td><td class="am" style="color:var(--red)">${fmt(p.amount)}</td><td>${p.mode}</td><td style="font-size:12px">${p.ref}</td></tr>`).join('')}
    </tbody></table></div>
  </div>`;
}

window.openCustPayForm = function(tripId){
  openModal('Record Customer Payment',`<div class="form-grid">
    <div class="form-row"><label>Trip</label><select id="f-cptid">${trips.map(t=>`<option value="${t.id}" ${tripId===t.id?'selected':''}>${t.id} — ${gc(t.customerId).name} — ${t.dest}</option>`).join('')}</select></div>
    <div class="form-row"><label>Amount (₹)</label><input type="number" id="f-cpamt" min="0"></div>
    <div class="form-row"><label>Date</label><input type="date" id="f-cpdate" value="${today()}"></div>
    <div class="form-row"><label>Mode</label><select id="f-cpmode">${modes.map(m=>`<option>${m}</option>`).join('')}</select></div>
    <div class="form-row"><label>Reference</label><input id="f-cpref" placeholder="UPI ref / NEFT no"></div>
    <div class="form-row"><label>Note</label><input id="f-cpnote" placeholder="e.g. Advance 50%"></div>
  </div>`,
  `<button class="btn btn-o" onclick="closeModal()">Cancel</button><button class="btn btn-p" onclick="saveCustPay()">Save</button>`);
};
window.saveCustPay = function(){
  const d={tripId:mVal('f-cptid'),amount:mNum('f-cpamt'),date:mVal('f-cpdate'),mode:mVal('f-cpmode'),ref:mVal('f-cpref'),note:mVal('f-cpnote')};
  if(!d.amount||!d.date)return alert('Amount and date required');
  custPayments.push({id:nid('CP'),...d});closeModal();render();
};

window.openPartPayForm = function(tripId){
  const trp = tripId ? trips.find(x=>x.id===tripId) : null;
  const partnerOpts = trp
    ? [...new Set(trp.services.map(s=>s.partnerId))].map(pid=>{const p=gp(pid);return `<option value="${pid}">${p.name}</option>`}).join('')
    : partners.filter(p=>p.status==='Active').map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  openModal('Record Partner Payment',`<div class="form-grid">
    <div class="form-row"><label>Trip</label><select id="f-pptid" onchange="ppTripChanged()">${trips.map(t=>`<option value="${t.id}" ${tripId===t.id?'selected':''}>${t.id} — ${t.dest}</option>`).join('')}</select></div>
    <div class="form-row"><label>Partner</label><select id="f-pppart">${partnerOpts}</select></div>
    <div class="form-row"><label>Amount (₹)</label><input type="number" id="f-ppamt" min="0"></div>
    <div class="form-row"><label>Date</label><input type="date" id="f-ppdate" value="${today()}"></div>
    <div class="form-row"><label>Mode</label><select id="f-ppmode">${modes.map(m=>`<option>${m}</option>`).join('')}</select></div>
    <div class="form-row"><label>Reference</label><input id="f-ppref" placeholder="UTR / NEFT no"></div>
  </div>`,
  `<button class="btn btn-o" onclick="closeModal()">Cancel</button><button class="btn btn-p" onclick="savePartPay()">Save</button>`);
};
window.ppTripChanged = function(){
  const tid=mVal('f-pptid');const t=trips.find(x=>x.id===tid);if(!t)return;
  const sel=document.getElementById('f-pppart');
  sel.innerHTML=[...new Set(t.services.map(s=>s.partnerId))].map(pid=>{const p=gp(pid);return `<option value="${pid}">${p?p.name:pid}</option>`}).join('');
};
window.savePartPay = function(){
  const tid=mVal('f-pptid'),pid=mVal('f-pppart'),amt=mNum('f-ppamt');
  if(!amt)return alert('Amount required');
  const t=trips.find(x=>x.id===tid);
  const svcIds=t?t.services.filter(s=>s.partnerId===pid).map(s=>s.id):[];
  partPayments.push({id:nid('PP'),partnerId:pid,tripId:tid,date:mVal('f-ppdate'),amount:amt,mode:mVal('f-ppmode'),ref:mVal('f-ppref'),svcIds});
  closeModal();render();
};

// ═══════════════════════════════════════
// INVOICES CRUD
// ═══════════════════════════════════════
function rInv(){
  return `<div class="top-bar"><div class="left"><div class="pt">Invoices</div><div class="ps" style="margin:0">${invoices.length} invoices</div></div><button class="btn btn-p" onclick="openInvForm()">+ Create Invoice</button></div>
  <div class="tw"><table><thead><tr><th>Invoice</th><th>Trip</th><th>Customer</th><th>Date</th><th>Base</th><th>GST 18%</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>
  ${invoices.map(inv=>{const t=trips.find(x=>x.id===inv.tripId);const c=t?gc(t.customerId):null;
    return `<tr><td style="font-weight:600">${inv.id}</td><td><span class="cl" onclick="showTrip('${inv.tripId}')">${inv.tripId}</span></td><td>${c?`<span class="cl" onclick="showCustomer('${c.id}')">${c.name}</span>`:'—'}</td><td style="font-size:12px">${inv.date}</td><td class="am">${fmt(inv.base)}</td><td class="am">${fmt(inv.gst)}</td><td class="am" style="font-weight:600">${fmt(inv.total)}</td><td>${badge(inv.status)}</td><td><button class="btn btn-o btn-s" onclick="openInvEdit('${inv.id}')">Edit</button></td></tr>`}).join('')}
  </tbody></table></div>`;
}

window.openInvForm = function(){
  openModal('Create Invoice',`<div class="form-grid">
    <div class="form-row"><label>Trip</label><select id="f-invtid" onchange="invTripChanged()">${trips.map(t=>`<option value="${t.id}">${t.id} — ${gc(t.customerId).name} — ${t.dest}</option>`).join('')}</select></div>
    <div class="form-row"><label>Date</label><input type="date" id="f-invdate" value="${today()}"></div>
    <div class="form-row"><label>Base Amount (₹)</label><input type="number" id="f-invbase" min="0" onchange="invCalc()"></div>
    <div class="form-row"><label>GST 18% (₹)</label><input type="number" id="f-invgst" readonly></div>
    <div class="form-row"><label>Total (₹)</label><input type="number" id="f-invtot" readonly></div>
    <div class="form-row"><label>Status</label><select id="f-invstat"><option>Issued</option><option>Partial</option><option>Paid</option></select></div>
  </div>
  <p style="font-size:12px;color:var(--text2);margin-top:8px">Base amount is prefilled from trip sell price. You can adjust it.</p>`,
  `<button class="btn btn-o" onclick="closeModal()">Cancel</button><button class="btn btn-p" onclick="saveInv()">Create</button>`);
  invTripChanged();
};
window.invTripChanged = function(){
  const tid=mVal('f-invtid');const t=trips.find(x=>x.id===tid);
  if(t){document.getElementById('f-invbase').value=tSell(t);invCalc()}
};
window.invCalc = function(){
  const b=mNum('f-invbase');const g=Math.round(b*.18);
  document.getElementById('f-invgst').value=g;document.getElementById('f-invtot').value=b+g;
};
window.saveInv = function(){
  const d={tripId:mVal('f-invtid'),date:mVal('f-invdate'),base:mNum('f-invbase'),gst:mNum('f-invgst'),total:mNum('f-invtot'),status:mVal('f-invstat')};
  if(!d.base)return alert('Base amount required');
  const n=invoices.length+1;d.id=`INV-2026-${String(n).padStart(3,'0')}`;
  invoices.push(d);closeModal();render();
};
window.openInvEdit = function(id){
  const inv=invoices.find(x=>x.id===id);if(!inv)return;
  openModal('Edit Invoice',`<div class="form-grid">
    <div class="form-row"><label>Invoice</label><input value="${inv.id}" disabled></div>
    <div class="form-row"><label>Trip</label><input value="${inv.tripId}" disabled></div>
    <div class="form-row"><label>Date</label><input type="date" id="f-eivdate" value="${inv.date}"></div>
    <div class="form-row"><label>Base (₹)</label><input type="number" id="f-eivbase" value="${inv.base}" onchange="eivCalc()"></div>
    <div class="form-row"><label>GST 18% (₹)</label><input type="number" id="f-eivgst" value="${inv.gst}" readonly></div>
    <div class="form-row"><label>Total (₹)</label><input type="number" id="f-eivtot" value="${inv.total}" readonly></div>
    <div class="form-row"><label>Status</label><select id="f-eivstat"><option ${inv.status==='Issued'?'selected':''}>Issued</option><option ${inv.status==='Partial'?'selected':''}>Partial</option><option ${inv.status==='Paid'?'selected':''}>Paid</option></select></div>
  </div>`,
  `<button class="btn btn-o" onclick="closeModal()">Cancel</button><button class="btn btn-d" onclick="delInv('${inv.id}')">Delete</button><button class="btn btn-p" onclick="updateInv('${inv.id}')">Update</button>`);
};
window.eivCalc = function(){const b=mNum('f-eivbase');const g=Math.round(b*.18);document.getElementById('f-eivgst').value=g;document.getElementById('f-eivtot').value=b+g};
window.updateInv = function(id){
  const inv=invoices.find(x=>x.id===id);
  inv.date=mVal('f-eivdate');inv.base=mNum('f-eivbase');inv.gst=mNum('f-eivgst');inv.total=mNum('f-eivtot');inv.status=mVal('f-eivstat');
  closeModal();render();
};
window.delInv = function(id){invoices=invoices.filter(x=>x.id!==id);closeModal();render()};

// ═══════════════════════════════════════
// REPORTS
// ═══════════════════════════════════════
function rRep(){
  const mr=trips.map(t=>({id:t.id,dest:t.dest,cust:gc(t.customerId).name,co:tCost(t),se:tSell(t),mg:tMargin(t),pct:tSell(t)?(tMargin(t)/tSell(t)*100).toFixed(1):'0',st:t.status}));
  const tco=mr.reduce((s,r)=>s+r.co,0),tse=mr.reduce((s,r)=>s+r.se,0),tmg=mr.reduce((s,r)=>s+r.mg,0);
  const cr=customers.map(c=>{const ct=trips.filter(t=>t.customerId===c.id);const se=ct.reduce((s,t)=>s+tSell(t),0);const pd=ct.reduce((s,t)=>s+cpaid(t.id),0);return{name:c.name,city:c.city,se,pd,due:se-pd}}).filter(c=>c.se>0);
  const pr=partners.map(p=>{const svcs=trips.flatMap(t=>t.services.filter(s=>s.partnerId===p.id));const tot=svcs.reduce((s,v)=>s+v.cost,0);const pd=ppaid(p.id);return{name:p.name,type:p.type,tot,pd,due:tot-pd}}).filter(p=>p.tot>0);
  return `<div class="pt">Reports</div><div class="ps">Financial overview</div>
  <div class="tw"><div class="th"><h3>Trip Margin Report</h3></div><table><thead><tr><th>Trip</th><th>Customer</th><th>Dest</th><th>Cost</th><th>Sell</th><th>Margin</th><th>%</th><th>Status</th></tr></thead><tbody>
  ${mr.map(r=>`<tr><td><span class="cl" onclick="showTrip('${r.id}')">${r.id}</span></td><td>${r.cust}</td><td>${r.dest}</td><td class="am">${fmt(r.co)}</td><td class="am">${fmt(r.se)}</td><td class="am" style="color:var(--green)">${fmt(r.mg)}</td><td>${r.pct}%</td><td>${badge(r.st)}</td></tr>`).join('')}
  <tr style="font-weight:700;border-top:2px solid var(--border)"><td colspan="3">Total</td><td class="am">${fmt(tco)}</td><td class="am">${fmt(tse)}</td><td class="am" style="color:var(--green)">${fmt(tmg)}</td><td>${tse?((tmg/tse)*100).toFixed(1):'0'}%</td><td></td></tr>
  </tbody></table></div>
  <div class="two">
    <div class="tw"><div class="th"><h3>Customer Receivables</h3></div><table><thead><tr><th>Customer</th><th>City</th><th>Total</th><th>Paid</th><th>Due</th></tr></thead><tbody>
    ${cr.map(c=>`<tr><td>${c.name}</td><td>${c.city}</td><td class="am">${fmt(c.se)}</td><td class="am">${fmt(c.pd)}</td><td class="am" style="color:${c.due>0?'var(--orange)':'var(--green)'};font-weight:600">${fmt(c.due)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="tw"><div class="th"><h3>Partner Payables</h3></div><table><thead><tr><th>Partner</th><th>Type</th><th>Total</th><th>Paid</th><th>Due</th></tr></thead><tbody>
    ${pr.map(p=>`<tr><td>${p.name}</td><td><span class="badge b-pu">${p.type}</span></td><td class="am">${fmt(p.tot)}</td><td class="am">${fmt(p.pd)}</td><td class="am" style="color:${p.due>0?'var(--red)':'var(--green)'};font-weight:600">${fmt(p.due)}</td></tr>`).join('')}
    </tbody></table></div>
  </div>`;
}

// ═══════════════════════════════════════
render();
</script>
</body>
</html>
